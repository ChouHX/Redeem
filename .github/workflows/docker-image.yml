name: Docker Image

on:
  push:
    branches: [main]
    tags: ["v*", "*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      push:
        description: 构建完成后推送镜像到 GHCR
        type: boolean
        default: true
      platforms:
        description: 目标平台
        type: choice
        options:
          - linux/amd64,linux/arm64
          - linux/amd64
          - linux/arm64
        default: linux/amd64,linux/arm64

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # 手动触发可自选平台；PR 只验证 amd64；其余默认双架构
  PLATFORMS: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || (github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64') }}

jobs:
  build:
    name: Build ${{ matrix.variant.label }} image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # 两套后端并行构建。Go 已是主版本，占 latest；Node 退到 latest-node 仅供回滚。
        # Go 额外保留 latest-go，历史上引用过该标签的部署无需改动。
        variant:
          - label: Node
            dockerfile: ./Dockerfile
            suffix: "-node"
          - label: Go
            dockerfile: ./Dockerfile.go
            suffix: ""

    steps:
      - uses: actions/checkout@v7

      # GHCR 镜像名必须全小写，而仓库名是 ChouHX/Redeem
      - name: Resolve image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=${{ matrix.variant.suffix }}
            type=ref,event=pr,suffix=${{ matrix.variant.suffix }}
            type=semver,pattern={{version}},suffix=${{ matrix.variant.suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.variant.suffix }}
            type=sha,format=short,prefix=sha-,suffix=${{ matrix.variant.suffix }}
            type=raw,value=latest${{ matrix.variant.suffix }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest${{ matrix.variant.suffix }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            # 兼容标签：Go 镜像同时打 latest-go
            type=raw,value=latest-go,enable=${{ matrix.variant.label == 'Go' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.variant.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant.label }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant.label }}

      - name: Write job summary
        if: always()
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VARIANT: ${{ matrix.variant.label }}
        run: |
          {
            echo "### Docker 镜像（$VARIANT 后端）"
            echo ""
            echo "- 镜像仓库：\`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`"
            echo "- 构建平台：\`${{ env.PLATFORMS }}\`"
            echo ""
            echo "生成的标签："
            echo ""
            echo '```'
            printf '%s\n' "${TAGS:-（无）}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
